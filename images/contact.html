<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Shahed Zeid Mohammed Tahat</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html">Shahed<span>.</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a class="active" href="contact.html">Contact Me</a>
      </div>
    </nav>
  </header>

  <main class="contact-main container">
    <section class="contact-intro">
      <p class="eyebrow">LET’S CONNECT</p>
      <h1>Contact <span>Me</span></h1>
      <p>Have a question, an idea, or an opportunity? Fill in the form below.</p>
      <a class="email-link" href="mailto:sztahat24@cit.just.edu.jo">sztahat24@cit.just.edu.jo</a>
    </section>

    <form id="contactForm" class="contact-form" novalidate>
      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
      </div>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>
      <div class="form-field">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" placeholder="Enter your country" required>
      </div>
      <div class="form-field">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Write your message here..." required></textarea>
      </div>
      <button class="button submit-button" type="submit">Submit <span aria-hidden="true">↗</span></button>
      <p class="form-note">All fields are required.</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>© 2026 Shahed Zeid Mohammed Tahat</p>
      <a href="index.html">Back to Home</a>
    </div>
  </footer>
</body>
</html>
